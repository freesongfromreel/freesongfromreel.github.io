name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps (ffmpeg for shazamio)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: pytest -q backend/tests

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{github.ref == 'refs/heads/main'}}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render via API
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{secrets.RENDER_API_KEY}}
          RENDER_SERVICE_ID: ${{secrets.RENDER_SERVICE_ID}}
        run: |
          curl -s -X POST \
            -H 'Accept: application/json' \
            -H 'Authorization: Bearer $RENDER_API_KEY' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
      - name: Notify when Render secrets unset
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        env:
          RENDER_API_KEY: ${{secrets.RENDER_API_KEY}}
          RENDER_SERVICE_ID: ${{secrets.RENDER_SERVICE_ID}}
        run: echo "Site deploys to Pages, but backend auto-deploy is OFF until you add RENDER_API_KEY and RENDER_SERVICE_ID (see README)."
