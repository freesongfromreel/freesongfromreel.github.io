name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'pytest.ini'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pytest pytest-asyncio
      - name: Smoke test the static site
        run: pytest -q site/tests

  # Deploy the static site to GitHub Pages.
  # Repo MUST be named <owner>.github.io for the root to serve at <owner>.github.io.
  # NOTE: Pages source must be set to "GitHub Actions" (Settings→Pages) for this
  # workflow's artifact to be served. This deploys site/ (not repo root).
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4